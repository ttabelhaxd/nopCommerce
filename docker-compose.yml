version: "3.9"

services:
  nopcommerce_web:
    build: .
    container_name: nopcommerce
    restart: unless-stopped
    depends_on:
      - nopcommerce_database
      - jaeger
      - prometheus
      - telemetry_service
    environment:
      - OTEL_SERVICE_NAME=nopcommerce-service
      - OTEL_SERVICE_VERSION=5.0.0
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://telemetry_service:4317
      - OTEL_TRACES_SAMPLER_ARG=1.0  

    ports:
      - "80:80"
      - "9464:9464"   # Prometheus metrics expostas pela app
    volumes:
      - nopcommerce_data:/app_data

  nopcommerce_database:
    image: "mcr.microsoft.com/mssql/server:2019-latest"
    container_name: nopcommerce_mssql_server
    environment:
      SA_PASSWORD: "nopCommerce_db_password"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"

  telemetry_service:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: opentelemetry_collector
    command: ["--config=/etc/otel-config.yml"]
    volumes:
      - ./otel-config.yml:/etc/otel-config.yml
    ports:
      - "4317:4317"   # OTLP 
      - "9465:9464"   
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "9411:9411"
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards

volumes:
  nopcommerce_data:
  grafana_data:
